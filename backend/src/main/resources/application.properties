spring.application.name=stockpulse

spring.datasource.url=jdbc:postgresql://localhost:5432/stock_pulse
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
server.port=8081

spring.http.client.connect-timeout=3s
spring.http.client.read-timeout=15s
spring.config.import=optional:classpath:.env[.properties]
llm.provider=${LLM_PROVIDER:gemini}
llm.model=${LLM_MODEL:gemini-3.8-flash}
llm.base-url=${LLM_BASE_URL:https://generativelanguage.googleapis.com}
llm.api-key=${GEMINI_API_KEY:}
stockpulse.strategy.pricing=${STOCKPULSE_PRICING_STRATEGY:ai}
stockpulse.strategy.reorder=${STOCKPULSE_REORDER_STRATEGY:ruleBased}
stockpulse.spike.multiplier=2.0
